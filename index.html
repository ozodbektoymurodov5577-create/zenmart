<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenmart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Playwrite+IT+Trad:wght@100..400&family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./public/css/command.css" />
    <link rel="stylesheet" href="./public/css/home.css" />
</head>
<body>
    <div class="navbar_frame">
        <div class="container">
            <div class="navbar_top">
                <a href="./index.html">
                    <img src="./public/images /imagescopy/logo.png" alt="" />
                </a>
                <div class="nav_search_frame">
        
                    <div class="search_box">
                        <div class="category_list">
                            <select name="" id="" >
                            <option value=" all" selected>all categories</option>
                            <option value="computer">computer</option>
                            </select>
                        </div>
                        <input type="text" placeholder="Search products..." />
                    </div>
                </div>
               
                <div class="search_icon_box"> 
                    <a href="./index.html"> <i class="fa-solid fa-magnifying-glass" style="color: rgb(207, 225, 240);"></i <br> </a></div>
                        <br> 
                        
                        <div class="nav_top_menu">
                            <div class="top_menu_box">
                                <div class="box_icon_box"> <i class="fa-regular fa-heart" style="color: rgb(207, 225, 240);"></i></div>
                                <div class="box_info_box">
                                    <span>Wishlist</span>
                                    <strong>My items</strong>
                                </div>
                            </div>
                            <div class="top_menu_box">
                                <div class="box_icon_box"> <i class="fa-regular fa-user" style="color: rgb(207, 225, 240);"></i></div>
                                <div class="box_info_box">
                                    <span>Sign in</span>
                                    <strong>Account</strong>
                                </div>
                            </div>

                            <div class="top_menu_box">
                                
                                <div class="box_icon_box"> <i class="fa-solid fa-cart-shopping" style="color: rgb(207, 225, 240);"></i> <br>
                                    <div class="basket_count">2</div>
                                
                                </div>
                                
                                <div class="box_info_box">
                                    <span>$200.99</span>
                                    <strong>Total</strong>
                                </div>
                            </div>
                            
                         </div>

            </div>
            <div class="navbar_bottom">
                <div class="navbar_bottom_menu_box">
                    <div class="browse_box">
                        <i class="fa-solid fa-bars" style="color: rgb(207, 225, 240);"></i>
                        <span>Browse Categories</span>
                    </div>


                    <div class="navbar_route_menu">
                        <a href="" class="title">Home</a>
                        <a href="" >Shop</a>
                        <a href="" >Orders</a>
                        <a href="" >About</a>
                        <a href="" >Contacts</a>
                    </div>

                    <div class="sorting">
                        <span> Deal of the Day</span>
                        <span>Hot Deals</span>
                        <span>Best Sellers</span>
                        <span>New Arrivals</span>
                    </div>

                </div>
            </div>
        </div>
        
    </div>
    
</body>
</html>
